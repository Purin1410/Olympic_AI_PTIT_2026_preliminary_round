[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-la-ai-ptit"
version = "0.1.0"
description = "Teaching package for the AI LA AI image classification task"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "Pillow>=10,<13",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
