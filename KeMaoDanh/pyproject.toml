[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ke-mao-danh"
version = "2.0.0"
description = "Real-image training, validation, and submission pipeline for Olympic AI PTIT 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "opencv-python==4.12.0.88",
    "Pillow==12.0.0",
    "matplotlib==3.10.9",
    "joblib==1.5.2",
    "nbformat==5.10.4",
    "nbclient==0.10.4",
    "nbconvert==7.16.6",
    "ipykernel==6.31.0",
    "jupyterlab==4.5.1",
]

[project.optional-dependencies]
cpu = [
    "torch==2.9.1",
    "torchvision==0.24.1",
]
cu128 = [
    "torch==2.9.1",
    "torchvision==0.24.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
